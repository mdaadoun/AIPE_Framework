<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 AIPE_Framework — Dashboard Industriel & Suivi</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #090514;
            --bg-card: rgba(20, 16, 32, 0.7);
            --primary: #8b5cf6;
            --secondary: #a78bfa;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #a7a8bc;
            --border: rgba(255, 255, 255, 0.08);
            --font-outfit: 'Outfit', sans-serif;
            --font-inter: 'Inter', sans-serif;
            --font-fira: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 55%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 55%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-inter);
            min-height: 100vh;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px);
            background: rgba(9, 5, 20, 0.65);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 16px 40px;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-outfit);
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 10px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-outfit);
            font-weight: 500;
            font-size: 0.88rem;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: #ffffff;
            background: var(--primary);
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 32px auto;
            padding: 0 40px;
        }

        .content-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            backdrop-filter: blur(20px);
            padding: 36px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            min-height: 550px;
            animation: fadeIn 0.45s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Documentation & Markdown */
        .markdown-body h1 {
            color: #ffffff;
            font-size: 1.6rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 16px;
        }

        .markdown-body h2 {
            color: var(--secondary);
            font-size: 1.3rem;
            margin-top: 24px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.15);
            padding-bottom: 6px;
        }

        .markdown-body p {
            margin: 10px 0;
            color: #e2e8f0;
            font-size: 0.95rem;
        }

        /* Interview Grid Layout */
        .interview-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 32px;
            height: 600px;
        }

        .question-list-panel {
            border-right: 1px solid var(--border);
            padding-right: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .question-item {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-outfit);
            font-weight: 500;
            font-size: 0.92rem;
            color: var(--text-muted);
            text-align: left;
        }

        .question-item:hover {
            border-color: rgba(167, 139, 250, 0.4);
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
        }

        .question-item.active {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.12);
            color: var(--secondary);
            box-shadow: inset 0 0 12px rgba(139, 92, 246, 0.08);
        }

        .workspace-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            padding-left: 10px;
        }

        .workspace-welcome {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            gap: 16px;
            opacity: 0.75;
        }

        .workspace-welcome svg {
            color: var(--primary);
            filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.4));
        }

        .question-title {
            font-family: var(--font-outfit);
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            border-left: 4px solid var(--primary);
            padding-left: 14px;
        }

        .answer-input {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #ffffff;
            font-family: var(--font-inter);
            font-size: 0.95rem;
            padding: 14px;
            resize: none;
            transition: all 0.25s ease;
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.15);
        }

        .btn {
            background: var(--primary);
            border: none;
            color: #ffffff;
            font-family: var(--font-outfit);
            font-weight: 600;
            font-size: 0.92rem;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            align-self: flex-start;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.35);
        }

        .btn-reveal {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        }

        .results-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-top: 10px;
            animation: fadeIn 0.3s ease-out;
        }

        .results-header {
            font-family: var(--font-outfit);
            font-weight: 600;
            font-size: 1.02rem;
            color: var(--secondary);
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        /* Test Launcher (Terminal look) */
        .terminal {
            background: #05020c;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: var(--font-fira);
            padding: 20px;
            min-height: 400px;
            max-height: 550px;
            overflow-y: auto;
            box-shadow: inset 0 0 16px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .terminal-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .terminal-title {
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .terminal-body {
            flex: 1;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #d8b4fe;
            white-space: pre-wrap;
        }

        .terminal-prompt {
            color: var(--success);
        }

        .terminal-output-success {
            color: #34d399;
        }

        .terminal-output-fail {
            color: #f87171;
        }

        .test-launcher-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .test-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 12px;
        }

        /* API Docs styling */
        .api-docs-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 24px;
            padding: 60px 20px;
            height: 100%;
        }

        .api-docs-panel h2 {
            font-family: var(--font-outfit);
            font-size: 1.6rem;
            font-weight: 700;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border);
            padding: 24px 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            background: rgba(9, 5, 20, 0.4);
        }

        /* Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.05);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <span>AIPE_Framework</span>
            </div>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('presentation')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    Présentation
                </button>
                <button class="tab-btn" onclick="switchTab('roadmap')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                    Roadmap
                </button>
                <button class="tab-btn" onclick="switchTab('glossaire')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20F4 3.5A2.5 2.5 0 0 1 6.5 1H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/></svg>
                    Glossaire
                </button>
                <button class="tab-btn" onclick="switchTab('journal')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    Journal
                </button>
                <button class="tab-btn" onclick="switchTab('entretien')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                    Simulateur
                </button>
                <button class="tab-btn" onclick="switchTab('tests')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    Lanceur Tests
                </button>
                <button class="tab-btn" onclick="switchTab('docs_api')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    Docs API
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="content-card" id="main-content">
            <div class="spinner"></div>
        </div>
    </main>

    <footer>
        <p>© 2026 AIPE_Framework — Conçu pour l'excellence opérationnelle des produits d'IA</p>
    </footer>

    <script>
        let currentTab = 'presentation';
        let faqQuestions = [];
        let activeQuestionId = null;

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => {
            loadTabContent('presentation');
        });

        function switchTab(tabName) {
            if (currentTab === tabName) return;
            
            // Set buttons active
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            currentTab = tabName;
            loadTabContent(tabName);
        }

        async function loadTabContent(tabName) {
            const container = document.getElementById('main-content');
            container.innerHTML = '<div class="spinner"></div>';
            
            try {
                if (tabName === 'entretien') {
                    renderInterviewSimulator(container);
                    return;
                }
                
                if (tabName === 'tests') {
                    renderTestLauncher(container);
                    return;
                }

                if (tabName === 'docs_api') {
                    renderApiDocsPanel(container);
                    return;
                }
                
                if (tabName === 'journal') {
                    renderJournalNavigator(container);
                    return;
                }
                
                const response = await fetch(`/api/${tabName}`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    container.innerHTML = `<div class="markdown-body">${data.html}</div>`;
                } else {
                    container.innerHTML = `<div style="color: #ef4444; padding: 20px;">Erreur : ${data.message}</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div style="color: #ef4444; padding: 20px;">Erreur de chargement : ${err.message}</div>`;
            }
        }

        async function renderInterviewSimulator(container) {
            container.innerHTML = `
                <div class="interview-grid">
                    <div class="question-list-panel" id="questions-list">
                        <div class="spinner"></div>
                    </div>
                    <div class="workspace-panel" id="workspace-panel">
                        <div class="workspace-welcome">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            <div>
                                <h3 style="font-family: var(--font-outfit); font-size: 1.2rem; font-weight: 600; color: #ffffff; margin-bottom: 6px;">Simulateur d'Entretien Oral</h3>
                                <p style="font-size: 0.9rem;">Sélectionnez une question technique dans le panneau de gauche pour vous entraîner.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            try {
                const response = await fetch('/api/entretien');
                const data = await response.json();
                
                if (data.status === 'success') {
                    faqQuestions = data.questions;
                    const listPanel = document.getElementById('questions-list');
                    listPanel.innerHTML = '';
                    
                    faqQuestions.forEach(q => {
                        const btn = document.createElement('button');
                        btn.className = 'question-item';
                        btn.innerHTML = q.question;
                        btn.onclick = () => selectQuestion(q.id, btn);
                        listPanel.appendChild(btn);
                    });
                }
            } catch (err) {
                document.getElementById('questions-list').innerHTML = `<div style="color: #ef4444; font-size: 0.85rem;">Erreur : ${err.message}</div>`;
            }
        }

        async function selectQuestion(id, btnElement) {
            document.querySelectorAll('.question-item').forEach(item => {
                item.classList.remove('active');
            });
            btnElement.classList.add('active');
            
            activeQuestionId = id;
            const q = faqQuestions.find(item => item.id === id);
            
            const workspace = document.getElementById('workspace-panel');
            workspace.innerHTML = `
                <div class="question-title">${q.question}</div>
                <div class="answer-box">
                    <label style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Formulez votre réponse à l'oral ou tapez-la ici pour comparer :</label>
                    <textarea class="answer-input" id="user-answer-input" placeholder="Écrivez votre réponse ici..."></textarea>
                    <button class="btn btn-reveal" onclick="revealAnswer(${id})">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        Révéler la Réponse Officielle
                    </button>
                </div>
                <div id="results-container"></div>
            `;
        }

        async function revealAnswer(id) {
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.innerHTML = '<div class="spinner"></div>';
            
            try {
                const response = await fetch(`/api/entretien/${id}`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    resultsContainer.innerHTML = `
                        <div class="results-box">
                            <div class="results-header">Réponse Officielle du Correcteur</div>
                            <div class="markdown-body">${data.answer_html}</div>
                        </div>
                    `;
                }
            } catch (err) {
                resultsContainer.innerHTML = `<div style="color: #ef4444; font-size: 0.9rem;">Erreur : ${err.message}</div>`;
            }
        }

        async function renderJournalNavigator(container) {
            container.innerHTML = `
                <div class="interview-grid">
                    <div class="question-list-panel" id="journal-list">
                        <div class="spinner"></div>
                    </div>
                    <div class="workspace-panel" id="journal-reader" style="padding-left: 10px;">
                        <div class="workspace-welcome">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                            <div>
                                <h3 style="font-family: var(--font-outfit); font-size: 1.2rem; font-weight: 600; color: #ffffff; margin-bottom: 6px;">Journal d'Apprentissage</h3>
                                <p style="font-size: 0.9rem;">Sélectionnez une séance de développement pour consulter son rapport détaillé.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            try {
                const response = await fetch('/api/journal');
                const data = await response.json();

                if (data.status === 'success') {
                    const listPanel = document.getElementById('journal-list');
                    listPanel.innerHTML = '';

                    data.entries.forEach((entry, idx) => {
                        const btn = document.createElement('button');
                        btn.className = 'question-item';
                        btn.style.display = 'flex';
                        btn.style.flexDirection = 'column';
                        btn.style.gap = '4px';
                        btn.innerHTML = `
                            <span style="font-weight: 600; color: #ffffff; font-size: 0.9rem;">${entry.title}</span>
                            <span style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-inter);">${entry.date}</span>
                        `;
                        btn.onclick = () => selectJournalEntry(entry.id, btn);
                        listPanel.appendChild(btn);

                        // Charger automatiquement la première entrée
                        if (idx === 0) {
                            selectJournalEntry(entry.id, btn);
                        }
                    });
                }
            } catch (err) {
                document.getElementById('journal-list').innerHTML = `<div style="color: #ef4444; font-size: 0.85rem;">Erreur : ${err.message}</div>`;
            }
        }

        async function selectJournalEntry(id, btnElement) {
            document.querySelectorAll('#journal-list .question-item').forEach(item => {
                item.classList.remove('active');
            });
            btnElement.classList.add('active');

            const reader = document.getElementById('journal-reader');
            reader.innerHTML = '<div class="spinner"></div>';

            try {
                const response = await fetch(`/api/journal/${id}`);
                const data = await response.json();

                if (data.status === 'success') {
                    reader.innerHTML = `<div class="markdown-body" style="animation: fadeIn 0.3s ease-out;">${data.html}</div>`;
                } else {
                    reader.innerHTML = `<div style="color: #ef4444; padding: 20px;">Erreur : ${data.message}</div>`;
                }
            } catch (err) {
                reader.innerHTML = `<div style="color: #ef4444; padding: 20px;">Erreur de chargement : ${err.message}</div>`;
            }
        }


        function renderTestLauncher(container) {
            container.innerHTML = `
                <div class="test-launcher-panel">
                    <div class="test-controls">
                        <div>
                            <h3 style="font-family: var(--font-outfit); font-size: 1.15rem; font-weight: 600; color: #ffffff;">Lanceur de Tests Live (QA)</h3>
                            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Exécute la suite de tests unitaires et de couverture (pytest) du framework.</p>
                        </div>
                        <button class="btn" id="run-tests-btn" onclick="executeTests()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            Lancer la Suite de Tests
                        </button>
                    </div>
                    
                    <div class="terminal" id="terminal-window">
                        <div class="terminal-header">
                            <div class="terminal-dots">
                                <div class="terminal-dot" style="background: var(--danger);"></div>
                                <div class="terminal-dot" style="background: var(--warning);"></div>
                                <div class="terminal-dot" style="background: var(--success);"></div>
                            </div>
                            <div class="terminal-title">bash - pytest qa_runner</div>
                        </div>
                        <div class="terminal-body" id="terminal-content">> En attente de lancement des tests...</div>
                    </div>
                </div>
            `;
        }

        async function executeTests() {
            const btn = document.getElementById('run-tests-btn');
            const terminal = document.getElementById('terminal-content');
            const terminalWindow = document.getElementById('terminal-window');
            
            btn.disabled = true;
            btn.innerHTML = `<div class="spinner" style="width:16px; height:16px; margin:0;"></div> Exécution...`;
            terminalWindow.style.borderColor = 'var(--warning)';
            
            terminal.innerHTML = `<span class="terminal-prompt">user@aipe-framework:~$</span> make test\n\n`;
            terminal.innerHTML += `⏳ Lancement de la suite de tests unitaires (pytest)... \n`;
            
            try {
                const response = await fetch('/api/run-tests', { method: 'POST' });
                const data = await response.json();
                
                if (data.status === 'success') {
                    terminalWindow.style.borderColor = 'var(--success)';
                    terminal.innerHTML += `<span class="terminal-output-success">[PASS] ${data.message}</span>\n\n`;
                    terminal.innerHTML += htmlEscape(data.stdout || data.stderr || 'Aucune sortie standard.');
                } else if (data.status === 'failed') {
                    terminalWindow.style.borderColor = 'var(--danger)';
                    terminal.innerHTML += `<span class="terminal-output-fail">[FAIL] ${data.message}</span>\n\n`;
                    terminal.innerHTML += htmlEscape(data.stderr || data.stdout || 'Aucune sortie d\'erreur.');
                } else {
                    terminalWindow.style.borderColor = 'var(--danger)';
                    terminal.innerHTML += `<span class="terminal-output-fail">[ERROR] ${data.message}</span>`;
                }
            } catch (err) {
                terminalWindow.style.borderColor = 'var(--danger)';
                terminal.innerHTML += `\n❌ Erreur de communication avec l'API : ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    Relancer la Suite de Tests
                `;
            }
        }

        function renderApiDocsPanel(container) {
            container.innerHTML = `
                <div class="api-docs-panel">
                    <div style="background: rgba(139, 92, 246, 0.1); padding: 24px; border-radius: 50%; display: inline-flex; justify-content: center; align-items: center; border: 1px solid rgba(139, 92, 246, 0.2); margin-bottom: 12px; filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.2));">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--secondary);"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <div>
                        <h2>Documentation interactive de l'API (Swagger UI)</h2>
                        <p style="max-width: 600px; margin: 10px auto var(--text-muted);">
                            La documentation interactive OpenAPI permet de visualiser et de tester en temps réel tous les endpoints de production d'AIPE_Framework (incluant la sonde de santé `/health`).
                        </p>
                    </div>
                    <a href="http://127.0.0.1:8000/docs" target="_blank" class="btn btn-reveal" style="align-self: center;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                        Ouvrir Swagger UI (Port 8000)
                    </a>
                </div>
            `;
        }

        function htmlEscape(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
